apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: custom-image
  title: Custom Image (Upstream Wrapper)
  description: >
    Scaffolds a repo that wraps an upstream container image with the minicloud CA cert
    baked in, plus the golden-path CI: build + **dual-push to Harbor (dev) and ghcr (prod)**,
    Trivy scan, keyless Cosign signature + SBOM on the ghcr image. Creates the Vault policy,
    a Backstage catalog entity, and registers the component. This produces the IMAGE only —
    DEPLOY it with the **wrapper-service** template (composable golden paths); deployment
    config belongs in minicloud-gitops, never baked here (conventions.md: code repo ≠ deploy repo).
  tags:
    - container
    - custom-image
    - golden-path
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Image Details
      required:
        - name
        - description
        - upstreamImage
        - owner
      properties:
        name:
          title: Name
          type: string
          description: >
            Unique slug — lowercase, hyphens only, 4-30 chars. Becomes the
            GitHub repo name, the Harbor image (library/<name>) and the ghcr
            image (ghcr.io/andrelair-platform/<name>).
          pattern: '^[a-z][a-z0-9-]{2,28}[a-z0-9]$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One-line description (GitHub repo + Backstage catalog)
        upstreamImage:
          title: Upstream Image
          type: string
          description: >
            Full upstream image reference, e.g. ghcr.io/open-webui/open-webui:0.6.0
          default: ghcr.io/upstream/image:latest
        owner:
          title: Owner
          type: string
          description: Backstage entity ref for the owning team
          default: group:default/platform

  steps:
    - id: fetch-service
      name: Generate service files
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./service
        # Skeleton files carry a .njk extension so editors/actionlint don't mis-validate the
        # templated ci.yml as a real GitHub Actions workflow (it contains Nunjucks ${{ values.* }}
        # + a {% raw %} block → not valid standalone YAML). fetch:template renders each *.njk and
        # strips the extension (ci.yml.njk → ci.yml, Dockerfile.njk → Dockerfile, …).
        templateFileExtension: true
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          upstreamImage: ${{ parameters.upstreamImage }}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        repoUrl: github.com?owner=andrelair-platform&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        sourcePath: ./service
        repoVisibility: public
        gitAuthorName: AndreLiar
        gitAuthorEmail: andrelaurelyvan.kanmegnetabouguie@ynov.com
        gitCommitMessage: "feat: initial scaffold by Backstage custom-image template"
        deleteBranchOnMerge: true
        protectDefaultBranch: false

    - id: create-dev-branch
      name: Create dev branch
      action: github:branch:create
      input:
        repoUrl: github.com?owner=andrelair-platform&repo=${{ parameters.name }}
        name: dev
        sourceBranch: main

    - id: vault-setup
      name: Create Vault policy and seed initial secrets
      action: vault:policy:create
      input:
        name: ${{ parameters.name }}

    - id: register
      name: Register in Backstage catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
    text:
      - title: 1 — Build the image
        content: |
          Push to the `main` branch of the new repo (the initial scaffold already did).
          CI builds the wrapped image and **dual-pushes** it:
          - `harbor.10.0.0.200.nip.io/library/${{ parameters.name }}:<sha>` (dev)
          - `ghcr.io/andrelair-platform/${{ parameters.name }}:<sha>` (prod) — keyless Cosign-signed, SBOM attached.

          The `ghcr` package is created on the first push. If this app runs in prod,
          flip its visibility to **Internal** in the package UI (no API for this) — the
          deployment then mounts the shared `ghcr-pull` secret (handled by wrapper-service).
      - title: 2 — Deploy it (wrapper-service)
        content: |
          This template produced the IMAGE only. To deploy, run the **wrapper-service**
          golden-path template with `imageRepo = ${{ parameters.name }}` — it opens a
          conformant GAP wrapper-chart PR on minicloud-gitops (services/${{ parameters.name }}/helm
          + dev/prod ArgoCD apps). Deployment config never lives in this code repo.
      - title: Vault (auto-created)
        content: |
          Policy `${{ parameters.name }}` and initial secrets at
          `secret/platform/${{ parameters.name }}/config` were created automatically —
          toggle `needsSecret` in wrapper-service to wire them into the pod.

apiVersion: v2
name: ${{ values.name }}
description: ${{ values.description }}
type: application
version: 0.1.0
appVersion: "0.1.0"
# Helm golden path — this thin wrapper depends on the shared library chart (one OCI artifact).
# AFTER scaffolding: run `helm dependency update` in this dir and COMMIT Chart.lock — ArgoCD's
# repo-server runs `helm dependency build`, which requires the lock.
dependencies:
  - name: minicloud-app-deployment
    version: 0.4.0
    repository: oci://ghcr.io/andrelair-platform

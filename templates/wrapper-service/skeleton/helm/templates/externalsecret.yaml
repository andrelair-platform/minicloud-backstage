{{- if .Values.appSecret.enabled }}
# App config/secrets — every key in Vault secret/platform/${{ values.name }} is projected into the
# ${{ values.name }}-secret k8s Secret, which the pod consumes via envFrom (see values.yaml).
# Create the Vault secret first:  vault kv put secret/platform/${{ values.name }} KEY=VALUE ...
# NOTE: the ArgoCD Applications carry the ESO SSA ignoreDifferences for this resource.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${{ values.name }}-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ${{ values.name }}-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: platform/${{ values.name }}
{{- end }}

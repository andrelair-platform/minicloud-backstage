apiVersion: v2
name: kargo-${{ values.name }}
description: >-
  Kargo promotion pipeline for ${{ values.name }} (Project + Warehouse + dev/prod Stages +
  credentials + dev-verify AnalysisTemplate + ProjectConfig). The raw Kargo CRs live under
  files/ and are emitted verbatim by templates/manifests.yaml via .Files.Get, which does NOT
  run them through the Helm engine — so the Kargo promotion + ESO output expressions pass through
  untouched (no escaping). A pure packaging shim (one ArgoCD Helm source, zero kustomization.yaml).
type: application
version: 0.1.0

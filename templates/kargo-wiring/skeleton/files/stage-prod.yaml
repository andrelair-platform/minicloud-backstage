{%- if values.warehouseModel == 'git' -%}
{%- set refExpr = 'commitFrom("https://github.com/andrelair-platform/' + values.sourceRepo + '.git").ID[0:7]' -%}
{%- else -%}
{%- set refExpr = 'imageFrom("ghcr.io/andrelair-platform/' + values.imageBasename + '").Tag' -%}
{%- endif -%}
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: ${{ values.name }}
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: ${{ values.name }}
      sources:
        # The multi-stage gate: only Freight already live + verified in `dev` is promotable here.
        stages:
          - dev
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: {% raw %}${{ vars.gitopsRepo }}{% endraw %}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-image
          config:
            # values-prod.yaml already pins image.repository=ghcr; only bump the tag.
            path: ./repo/services/${{ values.name }}/helm/values-prod.yaml
            updates:
              - key: minicloud-app-deployment.image.tag
                value: '{% raw %}${{ quote({% endraw %}${{ refExpr | safe }}{% raw %}) }}{% endraw %}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(${{ values.name }}): promote {% raw %}${{ {% endraw %}${{ refExpr | safe }}{% raw %} }}{% endraw %} to prod'
        - uses: git-push
          as: push
          if: {% raw %}${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}{% endraw %}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: {% raw %}${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}{% endraw %}
          config:
            repoURL: {% raw %}${{ vars.gitopsRepo }}{% endraw %}
            sourceBranch: {% raw %}${{ outputs.push.branch }}{% endraw %}
            targetBranch: main
            provider: github
            title: 'kargo(${{ values.name }}): promote to PROD — {% raw %}${{ {% endraw %}${{ refExpr | safe }}{% raw %} }}{% endraw %}'
            description: 'Promotion opened by Kargo. Requires CODEOWNERS approval (this is the prod gate). ArgoCD auto-syncs prod once merged. Squash-merge (Kargo commits are unsigned; main requires verified signatures).'
            labels: [kargo, env-prod]
        - uses: git-wait-for-pr
          as: wait-pr
          if: {% raw %}${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}{% endraw %}
          config:
            repoURL: {% raw %}${{ vars.gitopsRepo }}{% endraw %}
            prNumber: {% raw %}${{ outputs['open-pr'].pr.id }}{% endraw %}

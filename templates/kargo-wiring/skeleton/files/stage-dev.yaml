{%- if values.warehouseModel == 'git' -%}
{%- set refExpr = 'commitFrom("https://github.com/andrelair-platform/' + values.sourceRepo + '.git").ID[0:7]' -%}
{%- else -%}
{%- set refExpr = 'imageFrom("ghcr.io/andrelair-platform/' + values.imageBasename + '").Tag' -%}
{%- endif -%}
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: ${{ values.name }}
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: ${{ values.name }}
      sources:
        direct: true
  # After promoting to dev, run the smoke AnalysisRun. A Freight is "Verified in dev" only if it
  # passes → the prod Stage (sources.stages: [dev]) accepts only verified Freight = the dev→prod
  # gate, owned by Kargo (Option 2). argo-rollouts (cluster-scoped) reconciles the AnalysisRun.
  verification:
    analysisTemplates:
      - name: ${{ values.name }}-dev-verify
  promotionTemplate:
    spec:
      vars:
        - name: gitopsRepo
          value: https://github.com/andrelair-platform/minicloud-gitops.git
      steps:
        - uses: git-clone
          as: clone
          config:
            repoURL: {% raw %}${{ vars.gitopsRepo }}{% endraw %}
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: set-image
          config:
            path: ./repo/services/${{ values.name }}/helm/values-dev.yaml
            updates:
              - key: minicloud-app-deployment.image.tag
                value: '{% raw %}${{ quote({% endraw %}${{ refExpr | safe }}{% raw %}) }}{% endraw %}'
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: 'kargo(${{ values.name }}): promote {% raw %}${{ {% endraw %}${{ refExpr | safe }}{% raw %} }}{% endraw %} to dev'
        - uses: git-push
          as: push
          if: {% raw %}${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}{% endraw %}
          config:
            path: ./repo
            generateTargetBranch: true
        - uses: git-open-pr
          as: open-pr
          if: {% raw %}${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}{% endraw %}
          config:
            repoURL: {% raw %}${{ vars.gitopsRepo }}{% endraw %}
            sourceBranch: {% raw %}${{ outputs.push.branch }}{% endraw %}
            targetBranch: main
            provider: github
            title: 'kargo(${{ values.name }}): promote to dev — {% raw %}${{ {% endraw %}${{ refExpr | safe }}{% raw %} }}{% endraw %}'
            labels: [kargo, env-dev, automerge]
        - uses: git-wait-for-pr
          as: wait-pr
          if: {% raw %}${{ outputs.commit.commit != outputs.clone.commits['./repo'] }}{% endraw %}
          config:
            repoURL: {% raw %}${{ vars.gitopsRepo }}{% endraw %}
            prNumber: {% raw %}${{ outputs['open-pr'].pr.id }}{% endraw %}

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provision-database
  title: Provision a PostgreSQL database
  description: >
    Self-service PostgreSQL via Crossplane — pick a name, a namespace and a size, and this opens ONE PR
    on minicloud-gitops adding a `PostgresInstance` claim. On merge (reviewed — a DB holds persistent
    data) the `crossplane-claims` ArgoCD app syncs it and Crossplane provisions a CNPG cluster
    (1 instance for small, 2-instance HA for medium) + a NetworkPolicy locking it to the namespace,
    and drops the connection secret `<name>-cnpg-app`. No YAML, no Helm, no kubectl.
  tags:
    - golden-path
    - database
    - postgresql
    - crossplane
    - gitops
spec:
  owner: group:default/platform
  type: resource

  parameters:
    - title: Database
      required: [dbName, namespace, size]
      properties:
        dbName:
          title: Database name
          type: string
          description: >
            Lowercase slug — becomes the CNPG cluster `<name>-cnpg` and the connection secret
            `<name>-cnpg-app`.
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        namespace:
          title: Target namespace
          type: string
          description: >
            The consuming app's **existing** namespace — the claim, the CNPG cluster and the secret all
            land here. Claims do NOT create the namespace (deploy the app first).
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        size:
          title: Size
          type: string
          default: small
          enum: [small, medium]
          enumNames:
            - 'small — 1 instance (dev / low-stakes)'
            - 'medium — 2 instances, HA failover (prod-like)'
        storageSize:
          title: Storage size
          type: string
          default: 1Gi
          description: PVC size per instance (e.g. 1Gi, 5Gi, 10Gi).
          pattern: '^[0-9]+(Mi|Gi|Ti)$'
        owner:
          title: Owner
          type: string
          default: group:default/platform
          description: Backstage entity ref for the owning team.

  steps:
    - id: fetch
      name: Generate the PostgresInstance claim
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: platform/foundation/crossplane-claims/${{ parameters.namespace }}-${{ parameters.dbName }}
        values:
          dbName: ${{ parameters.dbName }}
          namespace: ${{ parameters.namespace }}
          size: ${{ parameters.size }}
          storageSize: ${{ parameters.storageSize }}

    - id: gitops-pr
      name: Open the database-provisioning PR on minicloud-gitops
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=andrelair-platform&repo=minicloud-gitops
        branchName: scaffolder/db-${{ parameters.namespace }}-${{ parameters.dbName }}
        title: "feat(db): provision PostgresInstance ${{ parameters.dbName }} in ${{ parameters.namespace }}"
        description: |
          Auto-generated by the Backstage **Provision a Database** golden-path template.

          Adds a `PostgresInstance` claim at
          `platform/foundation/crossplane-claims/${{ parameters.namespace }}-${{ parameters.dbName }}/claim.yaml`
          — size **${{ parameters.size }}** (${{ '2 instances, HA' if parameters.size == 'medium' else '1 instance' }}),
          storage **${{ parameters.storageSize }}**, namespace **${{ parameters.namespace }}**.

          On merge (reviewed — a DB holds persistent data) the `crossplane-claims` ArgoCD app syncs it →
          Crossplane provisions the CNPG cluster `${{ parameters.dbName }}-cnpg` + a NetworkPolicy + the
          connection secret **`${{ parameters.dbName }}-cnpg-app`** (host/dbname/user/password) in
          `${{ parameters.namespace }}`. Mount that secret into the app.

          **Precondition:** the `${{ parameters.namespace }}` namespace must already exist.

  output:
    links:
      - title: The provisioning PR (review + merge to provision)
        url: ${{ steps['gitops-pr'].output.remoteUrl }}
    text:
      - title: After merge
        content: |
          Once merged, watch the claim: `kubectl --context minicloud -n ${{ parameters.namespace }} get postgresinstance ${{ parameters.dbName }}`.
          The connection secret `${{ parameters.dbName }}-cnpg-app` appears when the CNPG cluster is Ready.

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: provision-app-bundle
  title: Provision an App Bundle (DB + network baseline)
  description: >
    Self-service app INFRASTRUCTURE via Crossplane — one claim gives an app its baseline infra in a
    single PR on minicloud-gitops: a PostgreSQL database (the `AppBundle` XR NESTS a `PostgresInstance`
    → CNPG cluster + the `<appName>-cnpg-app` secret) PLUS a default-deny baseline NetworkPolicy for the
    app's pods (ingress from ingress-nginx, egress to DNS + its own DB). It does NOT deploy the app —
    that's the `wrapper-service` Helm golden path; the two compose (the Deployment mounts the secret and
    its `app=<appName>` pods are selected by the netpol). No YAML, no Helm, no kubectl.
  tags:
    - golden-path
    - app-bundle
    - crossplane
    - networkpolicy
    - gitops
spec:
  owner: group:default/platform
  type: resource

  parameters:
    - title: App Bundle
      required: [appName, namespace, size]
      properties:
        appName:
          title: App name
          type: string
          description: >
            Lowercase slug. MUST match the app Deployment's `app=<appName>` pod label (the baseline
            NetworkPolicy selects it). Drives the DB (`<appName>-cnpg`), its secret (`<appName>-cnpg-app`)
            and the netpol (`<appName>-baseline`).
          pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
          ui:autofocus: true
        namespace:
          title: Target namespace
          type: string
          description: >
            The app's **existing** namespace — the bundle (DB + secret + netpol) all land here. Claims do
            NOT create the namespace (deploy the app first).
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
        size:
          title: Database size
          type: string
          default: small
          enum: [small, medium]
          enumNames:
            - 'small — 1 instance (dev / low-stakes)'
            - 'medium — 2 instances, HA failover (prod-like)'
        storageSize:
          title: Database storage size
          type: string
          default: 1Gi
          description: DB PVC size per instance (e.g. 1Gi, 5Gi, 10Gi).
          pattern: '^[0-9]+(Mi|Gi|Ti)$'
        owner:
          title: Owner
          type: string
          default: group:default/platform
          description: Backstage entity ref for the owning team.

  steps:
    - id: fetch
      name: Generate the AppBundle claim
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: platform/foundation/crossplane-claims/${{ parameters.namespace }}-${{ parameters.appName }}-bundle
        values:
          appName: ${{ parameters.appName }}
          namespace: ${{ parameters.namespace }}
          size: ${{ parameters.size }}
          storageSize: ${{ parameters.storageSize }}

    - id: gitops-pr
      name: Open the app-bundle PR on minicloud-gitops
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=andrelair-platform&repo=minicloud-gitops
        branchName: scaffolder/bundle-${{ parameters.namespace }}-${{ parameters.appName }}
        title: "feat(bundle): provision AppBundle ${{ parameters.appName }} in ${{ parameters.namespace }}"
        description: |
          Auto-generated by the Backstage **Provision an App Bundle** golden-path template.

          Adds an `AppBundle` claim at
          `platform/foundation/crossplane-claims/${{ parameters.namespace }}-${{ parameters.appName }}-bundle/claim.yaml`
          — a **${{ parameters.size }}** DB (${{ '2 instances, HA' if parameters.size == 'medium' else '1 instance' }}),
          storage **${{ parameters.storageSize }}**, namespace **${{ parameters.namespace }}**.

          On merge (reviewed — this provisions a database that holds persistent data) the `crossplane-claims`
          ArgoCD app syncs it → Crossplane composes a **nested PostgresInstance** (CNPG cluster
          `${{ parameters.appName }}-cnpg` + the connection secret **`${{ parameters.appName }}-cnpg-app`**)
          **and** a baseline NetworkPolicy `${{ parameters.appName }}-baseline` (ingress from ingress-nginx,
          egress to DNS + the DB).

          **Deploy the app separately** with the `wrapper-service` golden path — mount the
          `${{ parameters.appName }}-cnpg-app` secret, and label the Deployment `app=${{ parameters.appName }}`
          so the baseline netpol selects it.

          **Precondition:** the `${{ parameters.namespace }}` namespace must already exist.

  output:
    links:
      - title: The app-bundle PR (review + merge to provision)
        url: ${{ steps['gitops-pr'].output.remoteUrl }}
    text:
      - title: After merge
        content: |
          Watch it: `kubectl --context minicloud -n ${{ parameters.namespace }} get appbundle ${{ parameters.appName }}`.
          The nested DB appears as `postgresinstance/${{ parameters.appName }}`; the connection secret
          `${{ parameters.appName }}-cnpg-app` is ready once the CNPG cluster is up.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Registry: ghcr.io only (Harbor is being decommissioned — migrated 2026-11-16). ghcr is reached over
# the public internet, so no Tailscale / minicloud-CA trust is needed here.
env:
  REGISTRY: ghcr.io
  IMAGE_REPO: andrelair-platform/minicloud-backstage
  GITOPS_REPO: andrelair-platform/minicloud-gitops
  GITOPS_VALUES: helm-values/minicloud-1/backstage-values.yaml

jobs:
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Cosign keyless signing
      packages: write   # push to ghcr.io

    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - name: Compute SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── Build Backstage bundles ──────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Backstage (app + backend bundles)
        run: |
          yarn tsc
          yarn build:backend

      # ── Build and push image to ghcr.io ─────────────────────────────────────
      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push to ghcr
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.sha }}-amd64
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Security: scan + sign ────────────────────────────────────────────────
      - name: Scan for critical CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.sha }}-amd64
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }} \
            -o cyclonedx-json=sbom.json

      - name: Sign image (keyless — GitHub OIDC → Sigstore Fulcio)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}

      - name: Attach SBOM to image as OCI referrer
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}@${{ steps.push.outputs.digest }}

  bump-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minicloud-gitops
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Point the backstage image block at ghcr + bump the tag
        env:
          SHA: ${{ needs.build-and-push.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          TAG="${SHA}-amd64"
          FILE="${{ env.GITOPS_VALUES }}"

          # Scope to the backstage.image block only (the postgresql subchart has its own image block
          # further down — registry: docker.io). The harbor registry + library/backstage repository are
          # unique to backstage, so these regexes are no-ops once already on ghcr (idempotent).
          python3 - "$FILE" "$TAG" "$SHA" << 'PYEOF'
          import sys, re, datetime
          path, tag, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          content = open(path).read()
          today = datetime.date.today().isoformat()
          content = re.sub(r'# git SHA: .* — .*', f'# git SHA: {sha} — built {today} by CI', content)
          content = content.replace('registry: harbor.10.0.0.200.nip.io', 'registry: ghcr.io')
          content = content.replace('repository: library/backstage', 'repository: andrelair-platform/minicloud-backstage')
          content = re.sub(r'(tag: ")[^"]*-amd64(")', rf'\g<1>{tag}\2', content)
          open(path, 'w').write(content)
          PYEOF

          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No change — already at ${TAG}"
            exit 0
          fi
          BRANCH="ci/backstage-bump-${SHA}"
          git checkout -b "${BRANCH}"
          git commit -S -m "ci(backstage): point image at ghcr + bump to ${TAG}"
          git push origin "${BRANCH}"
          # Open the bump PR only — do NOT auto-merge. helm-values/ is CODEOWNERS-gated and main requires
          # verified signatures (squash) → a human reviews + squash-merges it through the gate.
          gh pr create \
            --repo "${{ env.GITOPS_REPO }}" \
            --title "ci(backstage): bump image to ${TAG}" \
            --base main \
            --head "${BRANCH}" \
            --body "Automated image bump from CI run ${{ github.run_id }} (now ghcr.io). \`helm-values/\` is CODEOWNERS-gated → review + **squash**-merge."
